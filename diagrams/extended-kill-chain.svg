<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Extended Cyber Kill Chain for AI-Era Threats</title>
  <desc>A defender-side framework that extends the Lockheed Martin Cyber Kill Chain with one new pre-attack stage, AI-augmented sub-techniques across the original seven stages, and an expanded Actions-on-Objectives stage covering Model Extraction and Agentic Pivot.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <linearGradient id="gradNew" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0f0"/>
      <stop offset="100%" stop-color="#ffd6d6"/>
    </linearGradient>
    <linearGradient id="gradMod" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffaeb"/>
      <stop offset="100%" stop-color="#ffeab3"/>
    </linearGradient>
    <linearGradient id="gradExp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#cfdfff"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="700" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Extended Cyber Kill Chain for AI-Era Threats</text>
  <text x="700" y="60" text-anchor="middle" font-size="13" fill="#555">v1.0 · May 19, 2026 · Gourav Nagar · CC BY 4.0 · github.com/gouravnagar-infosec/ai-kill-chain</text>

  <!-- Legend -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="14" height="14" fill="url(#gradNew)" stroke="#cc0000" stroke-width="1.5"/>
    <text x="20" y="12" font-size="12" fill="#333">New stage / sub-technique</text>
    <rect x="200" y="0" width="14" height="14" fill="url(#gradMod)" stroke="#cc8800" stroke-width="1.5"/>
    <text x="220" y="12" font-size="12" fill="#333">Original stage, AI-augmented</text>
    <rect x="430" y="0" width="14" height="14" fill="url(#gradExp)" stroke="#0044cc" stroke-width="1.5"/>
    <text x="450" y="12" font-size="12" fill="#333">Original stage, structurally expanded</text>
  </g>

  <!-- Main row of stages -->
  <g transform="translate(0, 150)">
    <!-- Stage 0 -->
    <g transform="translate(40, 0)">
      <rect width="140" height="110" rx="8" fill="url(#gradNew)" stroke="#cc0000" stroke-width="2"/>
      <text x="70" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#cc0000">STAGE 0 · NEW</text>
      <text x="70" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Model</text>
      <text x="70" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Supply Chain</text>
      <text x="70" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Compromise</text>
      <text x="70" y="100" text-anchor="middle" font-size="10" fill="#666">EKC-0.1 to 0.5</text>
    </g>

    <!-- Stage 1 -->
    <g transform="translate(210, 0)">
      <rect width="140" height="110" rx="8" fill="url(#gradMod)" stroke="#cc8800" stroke-width="2"/>
      <text x="70" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#aa6600">STAGE 1</text>
      <text x="70" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Reconnaissance</text>
      <text x="70" y="68" text-anchor="middle" font-size="10" fill="#666">model fingerprinting,</text>
      <text x="70" y="82" text-anchor="middle" font-size="10" fill="#666">prompt enumeration,</text>
      <text x="70" y="96" text-anchor="middle" font-size="10" fill="#666">tool discovery</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(380, 0)">
      <rect width="140" height="110" rx="8" fill="url(#gradMod)" stroke="#cc8800" stroke-width="2"/>
      <text x="70" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#aa6600">STAGE 2</text>
      <text x="70" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Weaponization</text>
      <text x="70" y="68" text-anchor="middle" font-size="10" fill="#666">adversarial prompts,</text>
      <text x="70" y="82" text-anchor="middle" font-size="10" fill="#666">multi-modal payloads,</text>
      <text x="70" y="96" text-anchor="middle" font-size="10" fill="#666">jailbreak chains</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(550, 0)">
      <rect width="140" height="110" rx="8" fill="url(#gradMod)" stroke="#cc8800" stroke-width="2"/>
      <text x="70" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#aa6600">STAGE 3</text>
      <text x="70" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Delivery</text>
      <text x="70" y="68" text-anchor="middle" font-size="10" fill="#666">indirect injection via</text>
      <text x="70" y="82" text-anchor="middle" font-size="10" fill="#666">web, RAG, email, docs,</text>
      <text x="70" y="96" text-anchor="middle" font-size="10" fill="#666">tool descriptions</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(720, 0)">
      <rect width="140" height="110" rx="8" fill="url(#gradMod)" stroke="#cc8800" stroke-width="2"/>
      <text x="70" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#aa6600">STAGE 4</text>
      <text x="70" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Exploitation</text>
      <text x="70" y="68" text-anchor="middle" font-size="10" fill="#666">injection success,</text>
      <text x="70" y="82" text-anchor="middle" font-size="10" fill="#666">confused-deputy tools,</text>
      <text x="70" y="96" text-anchor="middle" font-size="10" fill="#666">guardrail bypass</text>
    </g>

    <!-- Stage 5 -->
    <g transform="translate(890, 0)">
      <rect width="140" height="110" rx="8" fill="url(#gradMod)" stroke="#cc8800" stroke-width="2"/>
      <text x="70" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#aa6600">STAGE 5</text>
      <text x="70" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Installation</text>
      <text x="70" y="68" text-anchor="middle" font-size="10" fill="#666">memory implants,</text>
      <text x="70" y="82" text-anchor="middle" font-size="10" fill="#666">system prompt overrides,</text>
      <text x="70" y="96" text-anchor="middle" font-size="10" fill="#666">malicious connectors</text>
    </g>

    <!-- Stage 6 -->
    <g transform="translate(1060, 0)">
      <rect width="140" height="110" rx="8" fill="url(#gradMod)" stroke="#cc8800" stroke-width="2"/>
      <text x="70" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#aa6600">STAGE 6</text>
      <text x="70" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Command &amp;</text>
      <text x="70" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Control</text>
      <text x="70" y="82" text-anchor="middle" font-size="10" fill="#666">memory/RAG-mediated</text>
      <text x="70" y="96" text-anchor="middle" font-size="10" fill="#666">C2 channels</text>
    </g>

    <!-- Stage 7 (parent box) -->
    <g transform="translate(1230, 0)">
      <rect width="140" height="110" rx="8" fill="url(#gradExp)" stroke="#0044cc" stroke-width="2"/>
      <text x="70" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#0044cc">STAGE 7 · EXPANDED</text>
      <text x="70" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Actions on</text>
      <text x="70" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Objectives</text>
      <text x="70" y="84" text-anchor="middle" font-size="10" fill="#666">three peer sub-stages</text>
      <text x="70" y="98" text-anchor="middle" font-size="10" fill="#666">below</text>
    </g>
  </g>

  <!-- Arrows between stages -->
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="205" x2="210" y2="205"/>
    <line x1="350" y1="205" x2="380" y2="205"/>
    <line x1="520" y1="205" x2="550" y2="205"/>
    <line x1="690" y1="205" x2="720" y2="205"/>
    <line x1="860" y1="205" x2="890" y2="205"/>
    <line x1="1030" y1="205" x2="1060" y2="205"/>
    <line x1="1200" y1="205" x2="1230" y2="205"/>
  </g>

  <!-- Branch lines from Stage 7 to sub-stages -->
  <g stroke="#0044cc" stroke-width="1.5" fill="none">
    <!-- Trunk from Stage 7 bottom down to junction -->
    <line x1="1300" y1="260" x2="1300" y2="305"/>
    <!-- Horizontal bus connecting branch points -->
    <line x1="960" y1="305" x2="1320" y2="305"/>
    <!-- Three drops down to the sub-stage tops -->
    <line x1="960" y1="305" x2="960" y2="340" marker-end="url(#arrow)"/>
    <line x1="1140" y1="305" x2="1140" y2="340" marker-end="url(#arrow)"/>
    <line x1="1320" y1="305" x2="1320" y2="340" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 7 sub-stages row -->
  <g transform="translate(0, 340)">
    <!-- 7a -->
    <g transform="translate(880, 0)">
      <rect width="160" height="110" rx="8" fill="url(#gradExp)" stroke="#0044cc" stroke-width="2"/>
      <text x="80" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#0044cc">7a · CLASSICAL</text>
      <text x="80" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Data Exfiltration</text>
      <text x="80" y="72" text-anchor="middle" font-size="10" fill="#666">classical exfil,</text>
      <text x="80" y="86" text-anchor="middle" font-size="10" fill="#666">destruction, fraud,</text>
      <text x="80" y="100" text-anchor="middle" font-size="10" fill="#666">AI-amplified impact</text>
    </g>
    <!-- 7b -->
    <g transform="translate(1060, 0)">
      <rect width="160" height="110" rx="8" fill="url(#gradNew)" stroke="#cc0000" stroke-width="2"/>
      <text x="80" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#cc0000">7b · NEW</text>
      <text x="80" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Model Extraction</text>
      <text x="80" y="72" text-anchor="middle" font-size="10" fill="#666">API extraction, training</text>
      <text x="80" y="86" text-anchor="middle" font-size="10" fill="#666">data extraction, system</text>
      <text x="80" y="100" text-anchor="middle" font-size="10" fill="#666">prompt extraction</text>
    </g>
    <!-- 7c -->
    <g transform="translate(1240, 0)">
      <rect width="160" height="110" rx="8" fill="url(#gradNew)" stroke="#cc0000" stroke-width="2"/>
      <text x="80" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#cc0000">7c · NEW</text>
      <text x="80" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Agentic Pivot</text>
      <text x="80" y="72" text-anchor="middle" font-size="10" fill="#666">tool-mediated lateral,</text>
      <text x="80" y="86" text-anchor="middle" font-size="10" fill="#666">cross-app pivot,</text>
      <text x="80" y="100" text-anchor="middle" font-size="10" fill="#666">workflow weaponization</text>
    </g>
  </g>



  <!-- Differentiator footer -->
  <g transform="translate(40, 510)">
    <rect width="1320" height="80" rx="6" fill="#f7f8fa" stroke="#d0d4dc" stroke-width="1"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#222">Key structural differences from MITRE ATLAS (v5.4.0) and OWASP LLM Top 10 (2025):</text>
    <text x="20" y="42" font-size="11" fill="#444">· Kill-chain-sequenced view of the same threat surface (ATLAS organizes as a 16-tactic matrix; OWASP as a 10-risk list. Neither is a kill chain).</text>
    <text x="20" y="58" font-size="11" fill="#444">· Adds Stage 0 (Model Supply Chain Compromise) as a single pre-attack stage of the kill chain. Equivalent ATLAS techniques are distributed across multiple tactics.</text>
    <text x="20" y="74" font-size="11" fill="#444">· Expands Stage 7 into three peer sub-stages: classical exfiltration, model extraction, and agentic pivot. Each is its own adversary objective.</text>
  </g>
</svg>
