title: EKC Example - AI Agent Reads Process Environment or Credential Stores
id: ce6ef309-dd79-4e14-8f8e-6f61937d3e86
status: experimental
description: |
  EXAMPLE RULE. Not production-tuned.
  Flags agent tool calls that read the process environment, dump environment variables, or open
  common credential and agent-configuration files. In June 2026 Microsoft showed the Claude Code
  GitHub Action could be steered by issue content into reading /proc/self/environ and exposing
  ANTHROPIC_API_KEY. Anthropic blocked sensitive /proc files in Claude Code 2.1.128. The pattern
  applies to any agent with a read or shell tool and secrets in its environment (EKC-7c.6).
  Path matching runs against gen_ai.tool.call.arguments as stored by your backend; adjust the
  regular expressions if your pipeline keeps arguments as structured fields.
references:
  - https://www.microsoft.com/en-us/security/blog/2026/06/05/securing-ci-cd-in-agentic-world-claude-code-github-action-case/
  - https://atlas.mitre.org/studies/AML.CS0067
  - https://atlas.mitre.org/techniques/AML.T0083
author: Gourav Nagar
date: 2026-11-08
modified: 2026-11-08
tags:
  - ekc.7c.6
logsource:
  product: ai_agent
  category: tool_execution
detection:
  selection_op:
    gen_ai.operation.name: 'execute_tool'
  selection_proc_environ:
    gen_ai.tool.call.arguments|re: '/proc/(self|thread-self|[0-9]+)/environ'
  selection_shell:
    gen_ai.tool.name|contains:
      - 'bash'
      - 'shell'
      - 'terminal'
      - 'run_command'
      - 'exec'
  selection_env_dump:
    gen_ai.tool.call.arguments|re: '(^|[\s;&|"''`(])(printenv|env|export -p)(\s*$|\s*[;&|"''`)>])'
  selection_dotenv:
    gen_ai.tool.call.arguments|re: '(^|[/\s"''])\.env(\.(local|production|prod|staging|development|dev))?($|[\s"''])'
  selection_cred_files:
    gen_ai.tool.call.arguments|contains:
      - '.aws/credentials'
      - '.config/gcloud/'
      - '.azure/accessTokens'
      - '.azure/msal_token_cache'
      - '.ssh/id_'
      - '.netrc'
      - '.git-credentials'
      - '.docker/config.json'
      - '.kube/config'
      - '/mcp.json'
      - 'claude_desktop_config.json'
  filter_write_tools:
    gen_ai.tool.name|contains:
      - 'write'
      - 'edit'
  condition: selection_op and (selection_proc_environ or (selection_shell and selection_env_dump) or selection_dotenv or selection_cred_files) and not filter_write_tools
falsepositives:
  - Coding agents asked by the user to debug environment or credential configuration. Pair with ekc.content_origin to keep only reads triggered while untrusted content was in context.
  - .env.example and similar templates are excluded by the pattern; other committed sample files may still match.
level: high
