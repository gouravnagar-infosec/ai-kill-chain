title: EKC Example - AI Agent File Read of Process Environment or Credential Stores
id: ce6ef309-dd79-4e14-8f8e-6f61937d3e86
status: experimental
description: |
  EXAMPLE RULE. Not production-tuned.
  Flags file-read tool calls by an AI agent that target the process environment or common credential
  and agent-configuration files. In June 2026 Microsoft showed the Claude Code GitHub Action could be
  steered by issue content into reading /proc/self/environ and exposing ANTHROPIC_API_KEY. Anthropic
  blocked sensitive /proc files in Claude Code 2.1.128. The pattern applies to any agent with a
  read tool and secrets in its environment (EKC-7c.6).
references:
  - https://www.microsoft.com/en-us/security/blog/2026/06/05/securing-ci-cd-in-agentic-world-claude-code-github-action-case/
  - https://atlas.mitre.org/studies/AML.CS0067
  - https://atlas.mitre.org/techniques/AML.T0083
author: Gourav Nagar
date: 2026-11-08
tags:
  - ekc.7c.6
logsource:
  product: ai_agent
  category: tool_execution
detection:
  selection_op:
    gen_ai.operation.name: 'execute_tool'
  selection_paths:
    gen_ai.tool.call.arguments|contains:
      - '/proc/self/environ'
      - '/environ'
      - '.aws/credentials'
      - '.config/gcloud'
      - '.azure/'
      - '.ssh/id_'
      - '.netrc'
      - '.git-credentials'
      - '/.env'
      - 'mcp.json'
      - 'claude_desktop_config.json'
  condition: all of selection_*
falsepositives:
  - Coding agents asked by the user to debug environment or credential configuration. Pair with ekc.content_origin to keep only reads triggered while untrusted content was in context.
level: high
