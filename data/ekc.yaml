- id: 7b
  parent: '7'
  name: Model Extraction
  status: new
  summary: The target is the model itself, the data inside it, or the knowledge encoded in it.
  detection_signals:
  - >-
    High-volume programmatic query patterns from a single identity, especially with low entropy in query templates
    and high entropy in inputs.
  - Queries that contain classical memorization probes ("repeat the text above").
  - Query distributions that resemble published extraction attacks.
  mitigations:
  - Query-pattern analytics.
  - Memorization probes in red-team suites.
  - Watermarking of model outputs.
  sub_techniques:
