- id: 7c
  parent: '7'
  name: Agentic Pivot
  status: new
  summary: >-
    The compromised AI agent is used to take actions in connected systems, using its own legitimate permissions,
    or the credentials it holds are lifted and used elsewhere.
  detection_signals:
  - Tool calls whose arguments contain content traceable to untrusted upstream sources.
  - Tool-call graphs that cross trust boundaries that no human action did.
  - Spikes in cross-application calls per session.
  - Outbound communications initiated by agents to recipients not in any prior conversation history.
  mitigations:
  - Per-tool blast-radius limits.
  - Human-in-the-loop on high-impact tools.
  - >-
    Identity propagation review: does the downstream system know it is acting on behalf of an agent, not a user?
  sub_techniques:
  - id: EKC-7c.1
    name: Tool-mediated lateral action
    added_in: '1.0'
    description: >-
      The agent invokes legitimate tools (email send, file write, ticket creation, payment authorization) on behalf
      of the attacker.
    atlas:
    - AML.T0053
    - AML.T0086
    owasp_llm:
    - LLM06
    owasp_agentic:
    - ASI02
  - id: EKC-7c.2
    name: Cross-app pivot
    added_in: '1.0'
    description: >-
      The agent moves from one connected application to another (calendar to CRM to payment processor) by chaining
      tool calls.
    atlas:
    - AML.T0091
    - AML.T0098
    - AML.T0143
    owasp_llm:
    - LLM06
    owasp_agentic:
    - ASI02
    - ASI03
  - id: EKC-7c.3
    name: Identity confusion attack
    added_in: '1.0'
    description: >-
      The agent acts in a context where downstream systems treat its actions as the actions of a privileged user,
      granting privileges the attacker does not directly hold.
    atlas:
    - AML.T0091.000
    owasp_llm:
    - LLM06
    owasp_agentic:
    - ASI03
  - id: EKC-7c.4
    name: Recursive agent abuse
    added_in: '1.0'
    description: >-
      A compromised agent invokes other agents, propagating the compromise across an agent fabric without classical
      lateral movement.
    atlas:
    - AML.T0143
    - AML.T0103
    owasp_llm:
    - LLM06
    owasp_agentic:
    - ASI07
    - ASI08
  - id: EKC-7c.5
    name: Workflow weaponization
    added_in: '1.0'
    description: A stored automation or scheduled workflow runs the attacker's intended action on a recurring basis.
    atlas:
    - AML.T0081
    - AML.T0101
    - AML.T0142
    owasp_llm:
    - LLM06
    owasp_agentic:
    - ASI02
    - ASI10
  - id: EKC-7c.6
    name: Agent credential and token theft
    added_in: '1.1'
    description: >-
      Lift the credentials an agent holds or brokers (OAuth access and refresh tokens, MCP server tokens, API keys,
      session cookies, CI secrets) so the attacker can use them outside the agent. Paths include steering the agent
      to read its own environment or config files, abusing token passthrough or over-broad scopes in an MCP proxy,
      and malicious MCP servers that collect forwarded tokens. Once the token leaves, the attacker no longer needs
      the agent.
    atlas:
    - AML.T0098
    - AML.T0083
    - AML.T0055
    - AML.T0091.000
    - AML.T0113
    atlas_case_studies:
    - AML.CS0048
    - AML.CS0067
    owasp_llm:
    - LLM02
    - LLM06
    owasp_agentic:
    - ASI03
    detection_signals:
    - Agent file reads of /proc/*/environ, credential stores, or agent config files such as mcp.json.
    - Use of an agent-issued token from an IP, ASN or user agent the agent never runs from.
    - MCP servers receiving tokens whose audience is not the server itself (token passthrough).
    mitigations:
    - >-
      Follow the MCP authorization rules: servers must not accept tokens not issued to them, and proxies need per-client
      consent.
    - >-
      Issue short-lived, narrowly scoped tokens per agent and per task. Bind them to the workload where the IdP
      supports it.
    - >-
      Apply Meta's "Agents Rule of Two": no single agent should process untrusted input, hold secrets or private
      data, and change state or communicate externally at the same time.
    references:
    - https://modelcontextprotocol.io/specification/2025-11-25/basic/security_best_practices
    - >-
      https://www.microsoft.com/en-us/security/blog/2026/06/05/securing-ci-cd-in-agentic-world-claude-code-github-action-case/
    - https://github.com/LibreChat-AI/LibreChat/security/advisories/GHSA-pmw7-gqwj-f954
    - https://ai.meta.com/blog/practical-ai-agent-security/
